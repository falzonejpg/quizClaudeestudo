<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revisão — Inglês, Português e Literatura</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f2430;--mut:#5d6472;--bd:#dcd8cd;--ac:#2f5d8a;--acb:#e4edf6;--ok:#1d7a4a;--okb:#dff3e8;--no:#b3392f;--nob:#f8e1de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181e;--card:#1e222a;--tx:#e8eaee;--mut:#a0a7b4;--bd:#343a46;--ac:#8db8e6;--acb:#233245;--ok:#6fd39b;--okb:#1d3a2b;--no:#f08a80;--nob:#3f2421;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181e;--card:#1e222a;--tx:#e8eaee;--mut:#a0a7b4;--bd:#343a46;--ac:#8db8e6;--acb:#233245;--ok:#6fd39b;--okb:#1d3a2b;--no:#f08a80;--nob:#3f2421;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Georgia,"Times New Roman",serif}
header{padding:20px 16px 8px;max-width:820px;margin:0 auto}
h1{font-size:1.5rem;margin:0}
nav{display:flex;gap:8px;flex-wrap:wrap;max-width:820px;margin:0 auto;padding:8px 16px}
nav button,.btn{font:inherit;font-size:.95rem;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;cursor:pointer}
nav button.on,.btn.p{background:var(--ac);color:var(--bg);border-color:var(--ac)}
main{max-width:820px;margin:0 auto;padding:8px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;margin:12px 0}
h2{font-size:1.3rem;margin:.2em 0 .5em}h3{font-size:1.05rem;margin:.2em 0 .5em;color:var(--ac)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border:1px solid var(--bd);padding:6px 10px;text-align:left}th{background:var(--acb)}
.tip{background:var(--acb);border-left:4px solid var(--ac);padding:10px 14px;border-radius:8px;margin:12px 0}
ul{padding-left:20px;margin:.3em 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;text-align:left;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:12px 14px;min-height:56px;display:flex;align-items:center;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}
.opt:disabled{cursor:default}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--ac)}
.meta{color:var(--mut);font-size:.9rem}
.big{font-size:2.2rem;font-weight:bold;color:var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
@media (max-width:560px){body{font-size:15.5px}h1{font-size:1.25rem}main{padding:8px 12px 32px}.card{padding:14px}nav{flex-wrap:nowrap;overflow-x:auto;padding:8px 12px;-webkit-overflow-scrolling:touch}nav button{white-space:nowrap;flex:0 0 auto}th,td{padding:6px 8px;font-size:.88rem}.btn{width:100%;padding:12px 14px}.row{flex-direction:column}.opt{min-height:60px;font-size:1rem}}
html{-webkit-text-size-adjust:100%}button{touch-action:manipulation}
</style>
</head>
<body>
<header><h1>📚 Revisão de Conteúdos</h1><div class="meta">Inglês · Português · Literatura</div></header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
const SUBJ={ing:'Inglês',por:'Português',lit:'Literatura'};
const CONTENT={
ing:`<div class="card"><h2>Directions (direções e localização)</h2><div class="tw"><table><tr><th>Inglês</th><th>Português</th></tr>
<tr><td>Next to</td><td>Ao lado de</td></tr><tr><td>Between</td><td>Entre</td></tr><tr><td>In front of</td><td>Na frente de</td></tr><tr><td>Behind</td><td>Atrás de</td></tr><tr><td>Across from</td><td>Do outro lado / em frente</td></tr><tr><td>Near</td><td>Perto</td></tr><tr><td>Far from</td><td>Longe de</td></tr><tr><td>On the corner</td><td>Na esquina</td></tr><tr><td>Turn left</td><td>Vire à esquerda</td></tr><tr><td>Turn right</td><td>Vire à direita</td></tr><tr><td>Go straight</td><td>Siga em frente</td></tr></table></div></div>
<div class="card"><h2>There is e There are</h2><p>Os dois significam “há” ou “existe / existem”.</p><ul>
<li><b>There is</b>: singular. <i>There is a bank next to the school.</i> (Há um banco ao lado da escola.)</li>
<li><b>There are</b>: plural. <i>There are two parks near my house.</i> (Existem dois parques perto da minha casa.)</li>
<li><b>Negativa:</b> There isn’t = Não há (singular) | There aren’t = Não há (plural).</li>
<li><b>Perguntas:</b> Is there a hospital? | Are there two restaurants?</li></ul>
<div class="tip"><b>Macete:</b> IS = 1 | ARE = 2 ou mais. Não confunda o singular e o plural!</div></div>`,
por:`<div class="card"><h2>Formação de palavras</h2><h3>A) Derivação</h3><p>A palavra surge a partir de outra já existente.</p><div class="tw"><table><tr><th>Tipo</th><th>Como funciona</th><th>Exemplo</th></tr>
<tr><td>Prefixal</td><td>Adiciona prefixo</td><td>Infeliz</td></tr><tr><td>Sufixal</td><td>Adiciona sufixo</td><td>Felizmente</td></tr><tr><td>Prefixal e sufixal</td><td>Adiciona os dois</td><td>Infelizmente</td></tr><tr><td>Parassintética</td><td>Prefixo e sufixo simultâneos</td><td>Entardecer</td></tr><tr><td>Regressiva</td><td>Redução da palavra</td><td>Pescar → pesca</td></tr><tr><td>Imprópria</td><td>Muda a classe gramatical</td><td>O jantar (verbo → substantivo)</td></tr></table></div>
<div class="tip"><b>Atenção à diferença:</b> <i>Infelizmente</i>: existem as palavras infeliz e felizmente isoladamente, portanto é prefixal e sufixal. <i>Entardecer</i>: não existem, com o mesmo sentido e estrutura, as formas entarde e tardecer, portanto é parassintética.</div>
<h3>B) Composição</h3><p>Acontece quando duas ou mais palavras se juntam.</p><div class="tw"><table><tr><th>Tipo</th><th>Característica</th><th>Exemplo</th></tr>
<tr><td>Justaposição</td><td>Não perde sons ou letras</td><td>Guarda-chuva</td></tr><tr><td>Aglutinação</td><td>Há perda ou alteração sonora/gráfica</td><td>Planalto (plano + alto)</td></tr></table></div>
<div class="tip"><b>Macete:</b> Justaposição = palavras lado a lado | Aglutinação = palavras misturadas, com alteração.</div></div>`,
lit:`<div class="card"><h2>Barroco no Brasil (século XVII)</h2><p>Surgiu em um contexto de conflitos religiosos e contradições entre fé e razão.</p><ul>
<li><b>Dualismo:</b> conflito entre corpo e alma, pecado e perdão.</li><li><b>Religiosidade:</b> forte presença da religião.</li><li><b>Antítese:</b> oposição de ideias.</li><li><b>Paradoxo:</b> ideias aparentemente contraditórias.</li><li><b>Cultismo:</b> jogo de palavras e linguagem elaborada.</li><li><b>Conceptismo:</b> jogo de ideias e raciocínio.</li></ul>
<p><b>Autores:</b> Gregório de Matos (Boca do Inferno — poesias satíricas, religiosas e amorosas), Padre Antônio Vieira (sermões e conceptismo) e Aleijadinho (artes plásticas e arquitetura religiosa).</p>
<div class="tip"><b>Macete:</b> conflito, exagero, religiosidade e oposição de ideias.</div></div>
<div class="card"><h2>Arcadismo (século XVIII)</h2><p>Reação aos exageros do Barroco, valorizando a simplicidade e a natureza.</p><div class="tw"><table><tr><th>Característica</th><th>Significado</th></tr>
<tr><td>Bucolismo</td><td>Valorização da vida no campo</td></tr><tr><td>Pastoralismo</td><td>Vida simples de pastores</td></tr><tr><td>Fugere urbem</td><td>Fugir da cidade</td></tr><tr><td>Carpe diem</td><td>Aproveitar o dia</td></tr><tr><td>Locus amoenus</td><td>Lugar agradável, natureza idealizada</td></tr><tr><td>Aurea mediocritas</td><td>Vida simples e equilibrada</td></tr><tr><td>Inutilia truncat</td><td>Cortar o inútil, evitar excessos</td></tr></table></div>
<p><b>Autores:</b> Cláudio Manuel da Costa, Tomás Antônio Gonzaga e Basílio da Gama.</p><div class="tip"><b>Macete:</b> natureza, simplicidade, equilíbrio e vida no campo.</div></div>
<div class="card"><h2>Barroco × Arcadismo</h2><div class="tw"><table><tr><th>Barroco</th><th>Arcadismo</th></tr><tr><td>Exagero</td><td>Simplicidade</td></tr><tr><td>Conflitos</td><td>Equilíbrio</td></tr><tr><td>Religiosidade</td><td>Racionalidade</td></tr><tr><td>Linguagem elaborada</td><td>Linguagem mais simples</td></tr><tr><td>Dualismo</td><td>Harmonia com a natureza</td></tr></table></div></div>
<div class="card"><h2>Figuras de linguagem</h2><div class="tw"><table><tr><th>Figura</th><th>Significado</th><th>Exemplo</th></tr>
<tr><td>Metáfora</td><td>Comparação indireta</td><td>Você é uma estrela.</td></tr><tr><td>Comparação</td><td>Comparação explícita</td><td>Forte como um leão.</td></tr><tr><td>Hipérbole</td><td>Exagero</td><td>Estou morrendo de fome.</td></tr><tr><td>Eufemismo</td><td>Suavização</td><td>Ele partiu desta para melhor.</td></tr><tr><td>Ironia</td><td>Diz o contrário do que quer dizer</td><td>Que pontualidade! (para alguém atrasado)</td></tr><tr><td>Personificação</td><td>Atribuir ações humanas a coisas</td><td>O vento sussurrava.</td></tr><tr><td>Antítese</td><td>Ideias opostas</td><td>Amor e ódio.</td></tr><tr><td>Paradoxo</td><td>Contradição aparentemente impossível</td><td>Estou cego de tanto ver.</td></tr><tr><td>Metonímia</td><td>Substituição por associação</td><td>Li Machado de Assis.</td></tr><tr><td>Onomatopeia</td><td>Imitação de sons</td><td>Tic-tac, boom!</td></tr></table></div>
<div class="tip"><b>Pegadinha:</b> Antítese apresenta ideias contrárias | Paradoxo apresenta uma contradição dentro de uma mesma ideia.</div></div>
<div class="card"><h2>Interpretação de texto</h2><ul><li><b>Tema:</b> sobre o que o texto fala.</li><li><b>Ideia principal:</b> qual é a mensagem central.</li><li><b>Inferência:</b> o que podemos concluir sem estar escrito diretamente.</li><li><b>Ironia:</b> verificar se o autor quis dizer exatamente aquilo ou o oposto.</li><li><b>Contexto:</b> significado de uma palavra naquela situação específica.</li><li><b>Intenção do autor:</b> informar, criticar, convencer, divertir ou emocionar.</li></ul>
<div class="tip"><b>Atenção:</b> não marque uma alternativa só porque ela parece verdadeira no geral; ela precisa estar de acordo com o texto.</div></div>`};

// Formato: [pergunta, resposta certa, errada, errada, errada]
const Q={
ing:[
["Como se diz “ao lado de” em inglês?","Next to","Behind","Across","Between"],
["O que significa “Between”?","Entre","Atrás","Longe","Perto"],
["Qual é o significado de “Across from”?","Do outro lado","Ao lado de si","Atrás da casa","Longe do lugar"],
["“Turn left” quer dizer:","Vire à esquerda","Vire à direita","Siga em frente","Pare na esquina"],
["Complete: ___ a bank next to the school.","There is","There are","Those is","Those are"],
["Complete: ___ two parks near my house.","There are","There is","Is there","Are there"],
["Qual é a forma negativa de “There is”?","There isn’t","There aren’t","There not is","Not there is"],
["Como perguntar “Há um hospital?”","Is there a hospital?","Are there a hospital?","There is a hospital?","Is have a hospital?"],
["O macete diz que ARE é usado com:","2 ou mais coisas","Apenas um objeto","Somente lugares","Só em perguntas"],
["“On the corner” significa:","Na esquina","Na calçada","Na entrada","Na rotatória"]],
por:[
["“Infelizmente” é formada por derivação:","Prefixal e sufixal","Parassintética pura","Regressiva comum","Imprópria simples"],
["“Entardecer” é um caso de derivação:","Parassintética","Prefixal apenas","Sufixal apenas","Regressiva pura"],
["“Pescar → pesca” é um exemplo de:","Derivação regressiva","Derivação imprópria","Derivação prefixal","Derivação sufixal"],
["Em “o jantar”, um verbo virou substantivo. Isso é:","Derivação imprópria","Derivação regressiva","Derivação prefixal","Derivação sufixal"],
["“Guarda-chuva” é formada por:","Justaposição","Aglutinação","Parassíntese","Sufixação"],
["“Planalto” (plano + alto) é formada por:","Aglutinação","Justaposição","Parassíntese","Prefixação"],
["Por que “entardecer” é parassintética?","Prefixo e sufixo juntos","Só prefixo, sem sufixo","Perde letras ao juntar","Muda a classe apenas"],
["Na justaposição, as palavras:","Ficam lado a lado","Perdem alguns sons","Trocam de classe","Ganham um prefixo"],
["Na aglutinação, o que acontece?","Há perda de sons","Não há perda alguma","Só há um prefixo","Só há um sufixo"],
["Em “felizmente”, o que foi adicionado?","O sufixo -mente","O prefixo in-","Prefixo e sufixo","O prefixo des-"]],
lit:[
["O Barroco no Brasil surgiu em qual século?","Século XVII","Século XVIII","Século XIX","Século XVI"],
["Quem é o “Boca do Inferno”?","Gregório de Matos","Tomás A. Gonzaga","Basílio da Gama","Cláudio M. Costa"],
["O conceptismo é o jogo de:","Jogo de ideias","Jogo de palavras","Vida no campo","Fugir da cidade"],
["O cultismo é caracterizado por:","Jogo de palavras","Jogo de ideias","Vida no campo","Aproveitar o dia"],
["“Amor e ódio” é um exemplo de:","Antítese","Paradoxo","Metáfora","Hipérbole"],
["“Estou cego de tanto ver” é um exemplo de:","Paradoxo","Antítese","Metonímia","Metáfora"],
["O Arcadismo surgiu em qual século?","Século XVIII","Século XVII","Século XIX","Século XX"],
["“Carpe diem” significa:","Aproveitar o dia","Fugir da cidade","Cortar o inútil","Vida de pastor"],
["“Locus amoenus” significa:","Lugar agradável","Vida equilibrada","Cortar o inútil","Fugir da cidade"],
["“Li Machado de Assis” é um exemplo de:","Metonímia","Onomatopeia","Eufemismo","Hipérbole"]]};
// Observação: o quiz de Português usa 10 questões; "O jantar" (q4) e "Pescar" (q3) cobrem tipos diferentes.
Q.lit[2][0]="O conceptismo é caracterizado por:";

const $=s=>document.querySelector(s),app=$('#app'),nav=$('#nav');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const NAMES={home:'Início',ing:'Inglês',por:'Português',lit:'Literatura',geral:'Quiz geral'};
function go(v){location.hash=v}
function drawNav(v){nav.innerHTML=Object.keys(NAMES).map(k=>`<button class="${k===v?'on':''}" onclick="go('${k}')">${NAMES[k]}</button>`).join('')}
function home(){app.innerHTML=`<div class="card"><h2>Como usar</h2><p>Estude o conteúdo de cada matéria e depois faça o quiz dela (10 questões). Quando se sentir pronto, faça o <b>quiz geral</b> com 30 questões (10 de cada matéria).</p><div class="row">${['ing','por','lit'].map(k=>`<button class="btn" onclick="go('${k}')">${SUBJ[k]}</button>`).join('')}<button class="btn p" onclick="go('geral')">Quiz geral</button></div></div>`}
function subj(k){app.innerHTML=CONTENT[k]+`<div class="row"><button class="btn p" onclick="quiz('${k}')">Fazer o quiz de ${SUBJ[k]} (10 questões)</button></div>`}
let st;
function build(keys){const items=[];keys.forEach(k=>Q[k].forEach(q=>items.push({k,q:q[0],a:q[1],o:shuf(q.slice(1))})));return shuf(items)}
function quiz(k){const g=k==='geral';st={g,k,items:build(g?['ing','por','lit']:[k]),i:0,s:0,miss:[]};drawQ()}
function drawQ(){const it=st.items[st.i],n=st.items.length;
app.innerHTML=`<div class="card"><div class="meta">${st.g?'Quiz geral':'Quiz de '+SUBJ[st.k]} · Questão ${st.i+1} de ${n}${st.g?' · '+SUBJ[it.k]:''}</div><div class="bar"><i style="width:${st.i/n*100}%"></i></div><h2>${it.q}</h2><div class="opts">${it.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}</div><div id="fb"></div></div>`;
app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b))}
function answer(b){const it=st.items[st.i],ok=b.textContent===it.a;
app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent===it.a)x.classList.add('ok')});
if(ok)st.s++;else{b.classList.add('no');st.miss.push(it)}
const last=st.i===st.items.length-1;
$('#fb').innerHTML=`<p><b>${ok?'✅ Correto!':'❌ Resposta certa: '+it.a}</b></p><button class="btn p" id="nx">${last?'Ver resultado':'Próxima'}</button>`;
$('#nx').onclick=()=>{if(last)result();else{st.i++;drawQ()}}}
function result(){const n=st.items.length,p=Math.round(st.s/n*100);
app.innerHTML=`<div class="card"><div class="meta">Resultado</div><div class="big">${st.s} / ${n} (${p}%)</div>${st.miss.length?`<h3>Revise estas questões</h3><ul>${st.miss.map(m=>`<li>${m.q} <b>→ ${m.a}</b></li>`).join('')}</ul>`:'<p>Gabaritou! 🎉</p>'}<div class="row"><button class="btn p" onclick="quiz('${st.g?'geral':st.k}')">Refazer</button>${st.g?'':`<button class="btn" onclick="go('${st.k}')">Voltar ao conteúdo</button>`}<button class="btn" onclick="go('home')">Início</button></div></div>`}
function route(){const v=(location.hash||'#home').slice(1);drawNav(v);
if(v==='geral')quiz('geral');else if(SUBJ[v])subj(v);else home();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
